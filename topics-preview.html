<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151613">
  <title>CHRONOS — TOPICS Preview</title>
  <link rel="stylesheet" href="./styles-v4.css">
  <link rel="stylesheet" href="./topics-preview.css">
</head>
<body>
  <main class="topics-preview-shell">
    <header class="topics-preview-topbar">
      <a class="topics-preview-wordmark" href="./">CHRONOS</a>
      <div class="topics-preview-actions">
        <button class="topics-preview-lang" id="topicsLang" type="button">RU</button>
        <a class="topics-preview-close" href="./" aria-label="CHRONOSへ戻る">×</a>
      </div>
    </header>

    <section class="topics-preview-list" id="topicsList">
      <div class="topics-preview-intro">
        <div class="eyebrow">TOPICS</div>
        <h1 class="page-title" id="topicsTitle">テーマから旅する</h1>
        <p class="page-copy" id="topicsCopy">年代を覚える前に、気になる世界へ。ひとつのテーマから、暮らし・宗教・戦争・技術・他地域への影響までつながりでたどります。</p>
      </div>

      <div class="topics-preview-recommend-label" id="recommendLabel">最初のおすすめ</div>
      <div class="topics-preview-grid" id="topicsGrid"></div>
    </section>

    <section class="topics-preview-detail" id="topicDetail" hidden></section>
  </main>

  <script src="./topics-preview.js"></script>
</body>
</html>
